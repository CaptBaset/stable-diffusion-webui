name: HamRxBridge Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - 'HamRxBridge/**'
      - '.github/workflows/hamrxbridge.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: HamRxBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build -c Release
      - name: Publish self contained exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: HamRxBridge-win-x64
          path: HamRxBridge/publish/
      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath HamRxBridge-win-x64.zip
      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "hamrxbridge-build-${{ github.run_number }}"
          HamRxBridge/HamRxBridge-win-x64.zip
          --title "HamRxBridge 1.0 by AP2FLY (build ${{ github.run_number }})"
          --notes "Unzip and run HamRxBridge.exe. No installer needed. Radio control via OmniRig or the built in Icom and Kenwood CAT."
          --target ${{ github.sha }}
